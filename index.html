<body>
  <!-- 常駐無障礙輔助樹播報節點 -->
  <div id="status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="board-container">
    <header class="header-row">
      <div>
        <strong class="brand-title" data-i18n="appTitle">空間與邏輯演繹測試</strong>
        <span class="brand-subtitle" data-i18n="appSubtitle">/ 4×4 摩天透視空間推理</span>
      </div>
      <div>
        <button id="lang-switch" class="btn-secondary" aria-label="切換至英文介面">English</button>
      </div>
    </header>

    <!-- 1. 測驗說明與規格引導頁面 (初始顯示，計時尚未開始) -->
    <section id="intro-card">
      <h2 class="instructions-heading" data-i18n="introTitle">空間與邏輯演繹測試 (4×4 摩天透視)</h2>
      <p class="instructions-text" data-i18n="introPurpose"></p>

      <div class="rule-box">
        <!-- 規格概覽 -->
        <h4 class="rule-heading" data-i18n="specsHeading">📊 測驗規格概覽</h4>
        <p data-i18n="specItems.count"></p>
        <p data-i18n="specItems.duration"></p>
        <p data-i18n="specItems.scoring"></p>
        <p data-i18n="specItems.scale"></p>

        <!-- 玩法說明 -->
        <h4 class="rule-heading" data-i18n="rulesHeading">📋 網格規則與玩法說明</h4>
        <p data-i18n="rule1"></p>
        <p data-i18n="rule2"></p>
        <p data-i18n="rule3"></p>
        <div class="rule-example" data-i18n="ruleExample"></div>

        <!-- 操作指南 -->
        <h4 class="rule-heading" data-i18n="controlsHeading">⌨️ 操作方式</h4>
        <p data-i18n="controlClick"></p>
        <p data-i18n="controlKey"></p>

        <div class="time-notice" data-i18n="timeLimitInfo"></div>
      </div>

      <div class="action-row-center">
        <button id="start-btn" class="btn-primary-large" data-i18n="startBtn">我已理解規則與規格，開始測驗</button>
      </div>
    </section>

    <!-- 2. 測驗區域 (初始隱藏，點擊開始測驗後才顯示並啟動計時) -->
    <main id="exam-card" class="hidden">
      <h3 class="instructions-heading" data-i18n="instructionsTitle">4×4 摩天透視空間推理</h3>
      <p class="instructions-text" data-i18n="instructionsDesc"></p>
      
      <div class="timer-display">
        <span data-i18n="timeRemaining">剩餘時間</span>: <span id="timer">01:30</span>
      </div>

      <div id="grid-container"></div>

      <div class="action-row">
        <button id="submit-btn" class="btn-primary" data-i18n="submitBtn">完成交卷</button>
      </div>
    </main>

    <!-- 3. 結算報告區域 (交卷後顯示) -->
    <section id="result-card" class="hidden">
      <h2 class="result-heading" data-i18n="resultTitle">演繹評估完成</h2>
      <p class="result-subtext" data-i18n="resultSubtitle"></p>

      <div id="radar-container" class="radar-box"></div>

      <div class="metrics-panel">
        <p><span data-i18n="stanineLabel">Stanine</span>: <strong id="res-stanine" class="highlight-val"></strong></p>
        <p><span data-i18n="prLabel">PR</span>: <strong id="res-pr" class="highlight-val"></strong></p>
        <p><span data-i18n="receiptLabel">Receipt</span>: <span id="res-receipt" class="mono-sub"></span></p>
        <p><span data-i18n="eventChainLabel">Chain Hash</span>: <span id="res-chain" class="mono-mute"></span></p>
      </div>

      <div class="result-actions">
        <button id="restart-btn" class="btn-secondary" data-i18n="restartBtn">再測一次</button>
        <button id="print-btn" class="btn-primary" data-i18n="printBtn">列印 / 匯出報告</button>
      </div>
    </section>
  </div>

  <footer class="footer-disclaimer" data-i18n="disclaimer"></footer>

  <script type="module" src="js/app.js"></script>
</body>
